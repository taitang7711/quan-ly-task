version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: task-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: vinhtai1511
      MYSQL_DATABASE: task_manager
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    networks:
      - task-network

  backend:
    build: ./backend
    container_name: task-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=vinhtai1511
      - DB_NAME=task_manager
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - task-network

  frontend:
    build: ./frontend
    container_name: task-frontend
    restart: always
    ports:
      - "8099:80"
    depends_on:
      - backend
    networks:
      - task-network

volumes:
  mysql_data:

networks:
  task-network:
    driver: bridge
